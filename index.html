<title>FitSet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --ink: #201f1d;
    --muted: #6b655b;
    --paper: #f3f0ea;
    --paper-2: #e9e4da;
    --line: #d9d2c4;
    --accent: #b5651d;
    --accent-ink: #fbf6ee;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f3efe7;
      --muted: #a79f91;
      --paper: #171614;
      --paper-2: #201f1c;
      --line: #3a362f;
      --accent: #e2934f;
      --accent-ink: #201612;
    }
  }

  :root[data-theme="dark"] {
    --ink: #f3efe7;
    --muted: #a79f91;
    --paper: #171614;
    --paper-2: #201f1c;
    --line: #3a362f;
    --accent: #e2934f;
    --accent-ink: #201612;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(28px, 6vw, 72px) 20px;
  }

  .sheet {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    animation: settle 0.6s ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
    font-weight: 800;
    font-size: clamp(3.4rem, 15vw, 6.2rem);
    line-height: 0.86;
    letter-spacing: 0.01em;
    text-wrap: balance;
    color: var(--ink);
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 0;
    height: 6px;
  }

  .bar::before,
  .bar::after {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  .bar-line {
    flex: 1;
    height: 2px;
    background: var(--accent);
    margin: 0 -1px;
  }

  p.lede {
    margin: 0;
    max-width: 46ch;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink);
  }

  p.lede strong {
    color: var(--ink);
    font-weight: 500;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: var(--paper-2);
  }

  .stat {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-left: 1px solid var(--line);
  }

  .stat:first-child { border-left: none; }

  .stat .label {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat .value {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
    font-weight: 500;
    color: var(--ink);
  }

  .stat .value.on {
    color: var(--accent);
  }

  @media (max-width: 420px) {
    .board { grid-template-columns: 1fr; }
    .stat { border-left: none; border-top: 1px solid var(--line); }
    .stat:first-child { border-top: none; }
  }

  footer {
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>

<div class="sheet">
  <div class="eyebrow">Project log — entry 001</div>
  <h1>FitSet</h1>
  <div class="bar" aria-hidden="true"><span class="bar-line"></span></div>
  <p class="lede">
    This is the first mark of something new — a place to train an idea into shape.
    <strong>The idea and the build are still ahead.</strong> For now, consider this the starting line.
  </p>
  <div class="board">
    <div class="stat">
      <span class="label">Status</span>
      <span class="value on">Live</span>
    </div>
    <div class="stat">
      <span class="label">Logged</span>
      <span class="value">2026‑09‑29</span>
    </div>
    <div class="stat">
      <span class="label">Version</span>
      <span class="value">0.1</span>
    </div>
  </div>
  <footer>More soon.</footer>
</div>
