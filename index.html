<title>FitSet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --ink: #201f1d;
    --muted: #6b655b;
    --paper: #f3f0ea;
    --paper-2: #e9e4da;
    --line: #d9d2c4;
    --accent: #b5651d;
    --accent-ink: #fbf6ee;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f3efe7;
      --muted: #a79f91;
      --paper: #171614;
      --paper-2: #201f1c;
      --line: #3a362f;
      --accent: #e2934f;
      --accent-ink: #201612;
    }
  }

  :root[data-theme="dark"] {
    --ink: #f3efe7;
    --muted: #a79f91;
    --paper: #171614;
    --paper-2: #201f1c;
    --line: #3a362f;
    --accent: #e2934f;
    --accent-ink: #201612;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(28px, 6vw, 72px) 20px;
  }

  .sheet {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    animation: settle 0.6s ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: 'Big Shoulders Display', ui-sans-serif, sans-serif;
    font-weight: 800;
    font-size: clamp(3.4rem, 15vw, 6.2rem);
    line-height: 0.86;
    letter-spacing: 0.01em;
    text-wrap: balance;
    color: var(--ink);
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 0;
    height: 6px;
  }

  .bar::before,
  .bar::after {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  .bar-line {
    flex: 1;
    height: 2px;
    background: var(--accent);
    margin: 0 -1px;
  }

  p.lede {
    margin: 0;
    max-width: 46ch;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink);
  }

  p.lede strong {
    color: var(--ink);
    font-weight: 500;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: var(--paper-2);
  }

  .stat {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-left: 1px solid var(--line);
  }

  .stat:first-child { border-left: none; }

  .stat .label {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat .value {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
    font-weight: 500;
    color: var(--ink);
  }

  .stat .value.on {
    color: var(--accent);
  }

  @media (max-width: 420px) {
    .board { grid-template-columns: 1fr; }
    .stat { border-left: none; border-top: 1px solid var(--line); }
    .stat:first-child { border-top: none; }
  }

  footer {
    font-size: 0.85rem;
    color: var(--muted);
  }

  .auth {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 4px;
  }

  .auth .label {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #g_id_button {
    display: inline-flex;
  }

  .identity {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper-2);
  }

  .identity.visible {
    display: flex;
  }

  .identity img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex: none;
  }

  .identity .who {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .identity .name {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .identity .email {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .signout {
    margin-left: auto;
    flex: none;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .signout:hover {
    color: var(--ink);
    border-color: var(--muted);
  }

  .signout:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>

<div class="sheet">
  <div class="eyebrow">Project log — entry 001</div>
  <h1>FitSet</h1>
  <div class="bar" aria-hidden="true"><span class="bar-line"></span></div>
  <p class="lede">
    This is the first mark of something new — a place to train an idea into shape.
    <strong>The idea and the build are still ahead.</strong> For now, consider this the starting line.
  </p>
  <div class="board">
    <div class="stat">
      <span class="label">Status</span>
      <span class="value on">Live</span>
    </div>
    <div class="stat">
      <span class="label">Logged</span>
      <span class="value">2026‑09‑29</span>
    </div>
    <div class="stat">
      <span class="label">Version</span>
      <span class="value">0.1</span>
    </div>
  </div>

  <div class="auth">
    <span class="label">Sign in</span>
    <div id="g_id_button"></div>
    <div class="identity" id="identity">
      <img id="identity-pic" src="" alt="">
      <div class="who">
        <span class="name" id="identity-name"></span>
        <span class="email" id="identity-email"></span>
      </div>
      <button class="signout" id="signout" type="button">Sign out</button>
    </div>
  </div>

  <footer>More soon.</footer>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // Replace with the Client ID from Google Cloud Console → APIs & Services → Credentials.
  const GOOGLE_CLIENT_ID = "YOUR_CLIENT_ID.apps.googleusercontent.com";

  function base64UrlDecode(input) {
    const padded = input.replace(/-/g, '+').replace(/_/g, '/').padEnd(input.length + (4 - input.length % 4) % 4, '=');
    return decodeURIComponent(
      atob(padded)
        .split('')
        .map((c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'))
        .join('')
    );
  }

  function decodeJwt(token) {
    const payload = token.split('.')[1];
    return JSON.parse(base64UrlDecode(payload));
  }

  function handleCredentialResponse(response) {
    const profile = decodeJwt(response.credential);
    document.getElementById('identity-pic').src = profile.picture || '';
    document.getElementById('identity-pic').alt = profile.name || '';
    document.getElementById('identity-name').textContent = profile.name || '';
    document.getElementById('identity-email').textContent = profile.email || '';
    document.getElementById('identity').classList.add('visible');
    document.getElementById('g_id_button').style.display = 'none';
  }

  document.getElementById('signout').addEventListener('click', () => {
    google.accounts.id.disableAutoSelect();
    document.getElementById('identity').classList.remove('visible');
    document.getElementById('g_id_button').style.display = 'inline-flex';
  });

  window.onload = () => {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse,
    });
    google.accounts.id.renderButton(
      document.getElementById('g_id_button'),
      { theme: 'outline', size: 'medium', shape: 'rectangular' }
    );
  };
</script>
